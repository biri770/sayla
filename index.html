<!doctype html>
<html lang="tk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Saýla</title>
  <!-- iPhone: "Baş ekrana goşmak" — öz nyşany bilen, Safari zolagy bolmazdan açylýar -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saýla">
  <meta name="theme-color" content="#0F1214">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0F1214;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    /* Programma iPhone-yň sagat zolagynyň we aşaky çyzygyň (safe area) içinde */
    #sayla-app {
      position: fixed;
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      top: env(safe-area-inset-top);
      bottom: env(safe-area-inset-bottom);
    }
    #sayla-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #A9C2B3; font-family: -apple-system, Roboto, sans-serif; font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="sayla-loading">Saýla açylýar…</div>
  <div id="sayla-app"></div>
  <script src="zxing.min.js"></script>
  <script src="sayla-web.js"></script>
  <script src="sayla.js"></script>
  <script>
    // Internetsiz işlemek üçin: saýtyň faýllary telefonda saklanýar
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
</body>
</html>
